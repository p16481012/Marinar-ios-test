name: iOS prototype
run-name: Device Release compilation for 6e924ad
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  device:
    name: Verify device Release build (no IPA)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e924ad0bc9037ef63963e0ea0ada7aea500e694
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Verify runtime artifact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/39615226741 --jq .head_sha)" = '6e924ad0bc9037ef63963e0ea0ada7aea500e694'
      - uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          path: ios-app/build
          run-id: 39615226741
          github-token: ${{ github.token }}
      - run: |
          mkdir -p ios-app/Resources
          tar -xzf ios-app/build/runtime.tar.gz -C ios-app/Resources
      - run: node ios-app/scripts/download-node.mjs
      - name: Compile iPhoneOS Release
        run: >-
          xcodebuild -project ios-app/Marinar.xcodeproj -scheme Marinar
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ios-app/build/Device
          CURRENT_PROJECT_VERSION=19
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          build > ios-app/build/device-build.log 2>&1
      - name: Verify Release app and runtime
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const app = 'ios-app/build/Device/Build/Products/Release-iphoneos/Marinar.app';
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.equal(source, '6e924ad0bc9037ef63963e0ea0ada7aea500e694');
          const plist = JSON.parse(execFileSync('plutil', ['-convert', 'json', '-o', '-', path.join(app, 'Info.plist')], { encoding: 'utf8' }));
          assert.equal(plist.CFBundleIdentifier, 'com.p16481012.marinar.ios.test');
          assert.equal(plist.CFBundleShortVersionString, '2.5.1');
          assert.equal(plist.CFBundleVersion, '19');
          assert.equal(plist.MinimumOSVersion, '16.4');
          assert.deepEqual(plist.CFBundleSupportedPlatforms, ['iPhoneOS']);
          const executable = path.join(app, 'Marinar');
          const architecture = execFileSync('lipo', ['-archs', executable], { encoding: 'utf8' }).trim();
          assert.equal(architecture, 'arm64');
          const binary = await readFile(executable);
          const forbidden = ['MARINARA_TEST_DIAGNOSTICS', 'MARINARA_TEST_FILE_PANEL', 'MARINARA_TEST_FILES_CONTROL',
            'restored-file-fixture', 'marinar-ios-import-', 'MarinarDiagnosticWindow', 'ios-file-diagnostics'];
          for (const marker of forbidden) assert.ok(!binary.includes(Buffer.from(marker)), `DEBUG marker in Release: ${marker}`);
          const runtime = path.join(app, 'runtime');
          const manifest = JSON.parse(await readFile(path.join(runtime, 'runtime-manifest.json'), 'utf8'));
          assert.ok(manifest.files.some(file => file.path === 'restore-core.cjs'));
          for (const file of manifest.files) {
            assert.ok(!file.path.includes('..') && !path.isAbsolute(file.path));
            const bytes = await readFile(path.join(runtime, file.path));
            assert.equal(bytes.length, file.size, file.path);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), file.sha256, file.path);
          }
          const report = { status: 'passed', source, configuration: 'Release', platform: 'iPhoneOS', architecture,
            minimumOSVersion: plist.MinimumOSVersion, version: plist.CFBundleShortVersionString, build: plist.CFBundleVersion,
            runtimeFilesVerified: manifest.files.length, debugMarkersExcluded: forbidden,
            nativeUIValidated: false, physicalDeviceValidated: false, ipaCreated: false };
          await writeFile('ios-app/build/device-release-check.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-release-compilation-check
          path: |
            ios-app/build/device-build.log
            ios-app/build/device-release-check.json
          retention-days: 14
