name: iOS prototype
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Build and test packaged server
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SKIP_PWA: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @marinara-engine/shared build
      - run: pnpm --filter @marinara-engine/server exec tsc --noEmit --composite false --incremental false
      - run: pnpm --filter @marinara-engine/client build
      - run: node ios-app/scripts/prepare.mjs
      - run: node scripts/ios/run-chat-lifecycle.mjs --entry ios-app/Resources/runtime/bootstrap.cjs
      - run: node scripts/ios/run-provider-lifecycle.mjs --entry ios-app/Resources/runtime/bootstrap.cjs
      - run: node scripts/ios/run-transfer-lifecycle.mjs --entry ios-app/Resources/runtime/bootstrap.cjs
      - run: node scripts/ios/run-backup-ui.mjs --browser-channel chrome
      - name: Archive runtime without changing file permissions
        run: tar -czf ios-app/build/runtime.tar.gz -C ios-app/Resources runtime
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-runtime
          path: ios-app/build/runtime.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-validation
          path: |
            .tmp/ios-chat-lifecycle/report.json
            .tmp/ios-chat-lifecycle/server-*.log
            .tmp/ios-provider-lifecycle/report.json
            .tmp/ios-provider-lifecycle/transfer-server-*.log
            .tmp/ios-transfer-lifecycle/report.json
            .tmp/ios-transfer-lifecycle/transfer-server-*.log
            .tmp/ios-backup-ui/report.json
            .tmp/ios-backup-ui/*.png
            .tmp/ios-backup-ui/transfer-server-*.log
          include-hidden-files: true
          retention-days: 7
  ios:
    name: iOS Simulator (${{ matrix.profile }})
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [primary, compact-phone, ipad, startup-recovery, full-restore-ui]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          path: ios-app/build
      - run: |
          mkdir -p ios-app/Resources
          tar -xzf ios-app/build/runtime.tar.gz -C ios-app/Resources
          uname -m
          xcodebuild -version
      - run: node ios-app/scripts/download-node.mjs
      - name: Verify startup deadline state transitions
        if: matrix.profile == 'startup-recovery'
        run: |
          mkdir -p ios-app/build/validation/startup-recovery
          xcrun swiftc ios-app/App/StartupAttempt.swift ios-app/Tests/StartupAttemptTests.swift -o ios-app/build/startup-state-tests
          ios-app/build/startup-state-tests > ios-app/build/validation/startup-recovery/startup-state-tests.json
      - run: node ios-app/scripts/validate-simulator.mjs --simulator-ui --software-keyboard --profile ${{ matrix.profile }} --report-dir ios-app/build/validation/${{ matrix.profile }} --derived-data ios-app/build/DerivedData-${{ matrix.profile }}
        timeout-minutes: 28
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-summary-${{ matrix.profile }}
          path: |
            ios-app/build/validation/**/simulator-validation.json
            ios-app/build/validation/**/*export-events*.json
            ios-app/build/validation/**/*startup-state*.json
            ios-app/build/validation/**/*settings-restore-fixture.json
            ios-app/build/validation/**/*startup-live.log
            ios-app/build/validation/**/*ui-tests.log
            ios-app/build/validation/**/*file-picker.log
            ios-app/build/validation/**/*build.log
            ios-app/build/validation/**/*.png
            ios-app/build/validation/**/attachments/**/*.txt
            ios-app/build/validation/**/attachments/**/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-${{ matrix.profile }}
          path: ios-app/build/validation
          retention-days: 14
  ipa:
    name: Package validated device IPA
    needs: [runtime, ios]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          path: ios-app/build
      - run: |
          mkdir -p ios-app/Resources
          tar -xzf ios-app/build/runtime.tar.gz -C ios-app/Resources
      - run: node ios-app/scripts/download-node.mjs
      - name: Build device app
        run: >-
          xcodebuild -project ios-app/Marinar.xcodeproj -scheme Marinar
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ios-app/build/Device
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
          build > ios-app/build/device-build.log 2>&1
      - run: node ios-app/scripts/package-ipa.mjs --app ios-app/build/Device/Build/Products/Release-iphoneos/Marinar.app
      - uses: actions/upload-artifact@v4
        with:
          name: Marinar-ios-test-unsigned-ipa
          path: ios-app/build/release/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-build
          path: ios-app/build/device-build.log
          retention-days: 14
