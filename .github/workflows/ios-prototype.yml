name: Fresh main app file picker diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fresh-main-file-picker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-file-picker:
    name: Main app first install (Node and WebKit)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Record runtime artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ios-app/build/fresh-picker/report
          gh api repos/${{ github.repository }}/actions/runs/39618057694 > ios-app/build/fresh-picker/report/runtime-source-run.json
          gh api 'repos/${{ github.repository }}/actions/runs/39618057694/jobs?per_page=100' > ios-app/build/fresh-picker/report/runtime-source-jobs.json
      - uses: actions/download-artifact@v4
        with:
          name: embedded-runtime
          run-id: 39618057694
          github-token: ${{ github.token }}
          path: ios-app/build
      - name: Unpack the unchanged main runtime
        run: |
          mkdir -p ios-app/Resources
          tar -xzf ios-app/build/runtime.tar.gz -C ios-app/Resources
      - run: node ios-app/scripts/download-node.mjs
      - name: Run one first-install file diagnostic
        run: python3 diagnostics/fresh-main-file-picker/run.py
        timeout-minutes: 34
      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-main-file-picker-summary
          path: |
            ios-app/build/fresh-picker/report/*.json
            ios-app/build/fresh-picker/report/*.log
            ios-app/build/fresh-picker/report/*.txt
            ios-app/build/fresh-picker/report/*.xctestrun
            ios-app/build/fresh-picker/report/*.png
            ios-app/build/fresh-picker/report/attachments/**/*.png
            ios-app/build/fresh-picker/report/attachments/**/*.txt
            ios-app/build/fresh-picker/report/attachments/**/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload complete evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-main-file-picker-full
          path: ios-app/build/fresh-picker/report/
          retention-days: 7
