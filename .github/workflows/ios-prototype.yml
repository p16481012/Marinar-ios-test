name: Native document picker control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-file-picker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-control:
    name: UIKit picker (Xcode 26.2, iOS 26.2)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run one standalone native picker control
        run: python3 diagnostics/native-file-picker/run.py
        timeout-minutes: 30
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-file-picker-control
          path: diagnostics/native-file-picker/build/report/
          retention-days: 7
          if-no-files-found: error
